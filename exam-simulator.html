<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>telc B2 Simulator - Prüfung starten</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface': '#f8f9fb',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f3f4f6',
            'surface-container': '#edeef0',
            'surface-container-high': '#e7e8ea',
            'surface-container-highest': '#e1e2e4',
            'on-surface': '#191c1e',
            'on-surface-variant': '#3d4949',
            'primary': '#006768',
            'on-primary': '#ffffff',
            'primary-container': '#008284',
            'secondary': '#446277',
            'on-secondary': '#ffffff',
            'secondary-container': '#c5e4fd',
            'on-secondary-container': '#49667b',
            'outline': '#6d7979',
            'outline-variant': '#bdc9c9',
            'error': '#ba1a1a',
            'on-error': '#ffffff',
            'background': '#f8f9fb',
            'on-background': '#191c1e'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Manrope', sans-serif; background-color: #f8f9fb; color: #191c1e; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f3f4f6; }
    ::-webkit-scrollbar-thumb { background: #bdc9c9; border-radius: 4px; }

    .timer-critical { animation: pulse-red 1.5s infinite; }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .exam-locked {
      pointer-events: none;
      opacity: 0.5;
    }
  </style>
</head>
<body class="bg-surface">
  <!-- Landing Page -->
  <div id="landing-page" class="fixed inset-0 bg-gradient-to-b from-surface to-surface-container-low flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl w-full text-center">
      <div class="flex justify-center mb-6">
        <span class="material-symbols-outlined text-6xl text-primary">school</span>
      </div>
      <h1 class="text-4xl font-bold text-on-surface mb-3">telc B2 Simulator</h1>
      <p class="text-lg text-on-surface-variant mb-8">Realistic exam simulation with 150-minute timer and complete navigation freedom</p>

      <div id="exams-list" class="space-y-4 mb-8">
        <!-- Exam options will be loaded here -->
      </div>

      <div class="bg-white p-6 rounded-lg shadow-sm border border-outline-variant/20">
        <p class="text-on-surface-variant text-sm">
          ✓ No account required<br/>
          ✓ Free practice<br/>
          ✓ Automatic scoring<br/>
          ✓ Detailed feedback
        </p>
      </div>
    </div>
  </div>

  <!-- Exam Interface -->
  <div id="exam-page" class="hidden fixed inset-0 bg-surface flex flex-col">
    <!-- Header with Timer -->
    <header class="fixed top-0 w-full z-50 bg-surface-container-highest shadow-sm border-b border-outline-variant/20">
      <div class="max-w-full px-6 py-4 flex items-center justify-between h-20">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-primary">school</span>
          <h1 class="text-lg font-bold text-primary hidden md:block">telc B2 Exam</h1>
        </div>

        <!-- Global Timer (ABSOLUTE TIME) -->
        <div id="timer-display" class="flex items-center gap-3 px-4 py-2 bg-surface-container rounded-lg border border-outline-variant">
          <span class="material-symbols-outlined text-secondary text-xl">schedule</span>
          <span id="timer-text" class="font-bold text-secondary timer-display text-2xl tracking-widest">02:30:00</span>
        </div>

        <button id="finish-exam-btn" class="px-6 py-2 bg-primary text-on-primary rounded-lg font-semibold hover:bg-primary-container transition shadow-sm">
          Finish Exam
        </button>
      </div>

      <!-- Section Navigation Tabs -->
      <nav id="section-nav" class="h-14 px-6 bg-surface-container-low flex items-center gap-2 border-t border-outline-variant/30 overflow-x-auto">
        <!-- Section tabs will be populated here -->
      </nav>
    </header>

    <!-- Main Content Area -->
    <div class="pt-32 pb-8 px-6 flex-1 overflow-auto">
      <div class="max-w-6xl mx-auto">
        <!-- Sidebar Navigation -->
        <div class="flex gap-6">
          <aside class="w-64 hidden lg:block">
            <div id="sidebar-nav" class="space-y-4">
              <!-- Sidebar sections will be populated -->
            </div>
          </aside>

          <!-- Question Content -->
          <main id="exam-content" class="flex-1">
            <!-- Questions will be rendered here -->
          </main>
        </div>
      </div>
    </div>
  </div>

  <!-- Results Page -->
  <div id="results-page" class="hidden fixed inset-0 bg-surface overflow-auto pt-8 pb-8">
    <div class="max-w-4xl mx-auto">
      <!-- Results will be rendered here -->
    </div>
  </div>

  <script>
    // ============================================
    // EXAM STATE MANAGEMENT
    // ============================================
    class ExamManager {
      constructor() {
        this.exams = [];
        this.currentExam = null;
        this.currentSession = null;
        this.answers = {};
        this.examsData = null;
      }

      async loadExams() {
        try {
          const response = await fetch('./data/exams.json');
          this.examsData = await response.json();
          this.exams = this.examsData.exams;
        } catch (error) {
          console.error('Failed to load exams:', error);
          // Fallback data
          this.exams = [
            {
              id: 'pruefung-001',
              title: 'Modelltest B2 — Prüfung 001',
              description: 'Vollständiger telc B2 Modelltest',
              duration: 9000
            }
          ];
        }
      }

      startExam(examId) {
        this.currentExam = this.exams.find(e => e.id === examId);

        // Create session with absolute time
        const now = new Date();
        const expiresAt = new Date(now.getTime() + this.currentExam.duration * 1000);

        this.currentSession = {
          id: this.generateSessionId(),
          examId: examId,
          startedAt: now.toISOString(),
          expiresAt: expiresAt.toISOString(),
          status: 'active'
        };

        this.answers = {};
        this.saveSession();
      }

      generateSessionId() {
        return 'session_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
      }

      saveSession() {
        localStorage.setItem(`exam_session_${this.currentSession.id}`, JSON.stringify({
          session: this.currentSession,
          answers: this.answers
        }));
      }

      getTimeRemaining() {
        if (!this.currentSession) return 0;
        const now = new Date();
        const expiresAt = new Date(this.currentSession.expiresAt);
        const remaining = Math.max(0, expiresAt - now);
        return Math.floor(remaining / 1000);
      }

      isExamExpired() {
        return this.getTimeRemaining() === 0;
      }

      recordAnswer(questionId, answer) {
        this.answers[questionId] = {
          answer: answer,
          answeredAt: new Date().toISOString()
        };
        this.saveSession();
      }

      getAnswer(questionId) {
        return this.answers[questionId]?.answer || null;
      }
    }

    // ============================================
    // UI RENDERER
    // ============================================
    class UIRenderer {
      constructor(examManager) {
        this.exam = examManager;
      }

      formatTime(seconds) {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }

      renderLandingPage() {
        const landingPage = document.getElementById('landing-page');
        const examsList = document.getElementById('exams-list');

        examsList.innerHTML = this.exam.exams.map(exam => `
          <button onclick="app.startExam('${exam.id}')"
                  class="w-full p-6 bg-white rounded-lg shadow-sm border border-outline-variant/20 hover:shadow-md transition text-left">
            <h3 class="font-bold text-lg text-on-surface mb-2">${exam.title}</h3>
            <p class="text-on-surface-variant mb-4">${exam.description}</p>
            <div class="flex items-center justify-between">
              <span class="text-sm text-on-surface-variant">⏱️ ${exam.duration / 60} minutes</span>
              <span class="px-4 py-2 bg-primary text-on-primary rounded-lg font-semibold">Start</span>
            </div>
          </button>
        `).join('');
      }

      renderExamInterface() {
        const examPage = document.getElementById('exam-page');
        const examContent = document.getElementById('exam-content');
        const sectionNav = document.getElementById('section-nav');
        const sidebarNav = document.getElementById('sidebar-nav');

        // Render section tabs
        sectionNav.innerHTML = this.exam.currentExam.sections.map((section, idx) => `
          <button onclick="app.selectSection('${section.id}')"
                  id="tab-${section.id}"
                  class="px-6 py-3 text-label-md font-semibold text-on-surface-variant hover:text-primary transition whitespace-nowrap border-b-2 border-transparent">${section.name}</button>
        `).join('');

        // Select first section
        this.selectSection(this.exam.currentExam.sections[0].id);
      }

      selectSection(sectionId) {
        const section = this.exam.currentExam.sections.find(s => s.id === sectionId);
        const sectionNav = document.getElementById('section-nav');
        const examContent = document.getElementById('exam-content');

        // Update tab styles
        sectionNav.querySelectorAll('button').forEach(btn => {
          const btnSection = btn.id.replace('tab-', '');
          if (btnSection === sectionId) {
            btn.classList.add('border-primary', 'text-primary', 'font-bold');
            btn.classList.remove('border-transparent', 'text-on-surface-variant');
          } else {
            btn.classList.remove('border-primary', 'text-primary', 'font-bold');
            btn.classList.add('border-transparent', 'text-on-surface-variant');
          }
        });

        // Render content
        this.renderSectionContent(section, examContent);
      }

      renderSectionContent(section, container) {
        let html = `<h2 class="text-3xl font-bold text-on-surface mb-8">${section.name}</h2>`;

        if (section.parts && section.parts.length > 0) {
          section.parts.forEach(part => {
            html += `
              <div class="mb-12">
                <h3 class="text-2xl font-semibold text-on-surface mb-6">${part.title}</h3>
                <p class="text-on-surface-variant mb-8">${part.description}</p>
                <div class="space-y-6">
                  ${part.questions.map(q => this.renderQuestion(q)).join('')}
                </div>
              </div>
            `;
          });
        }

        container.innerHTML = html;
      }

      renderQuestion(question) {
        const currentAnswer = this.exam.getAnswer(question.id);

        switch(question.type) {
          case 'matching':
            return this.renderMatchingQuestion(question, currentAnswer);
          case 'multipleChoice':
            return this.renderMultipleChoice(question, currentAnswer);
          case 'fillInTheBlank':
            return this.renderFillInBlank(question, currentAnswer);
          case 'writing':
            return this.renderWritingQuestion(question, currentAnswer);
          default:
            return '';
        }
      }

      renderMatchingQuestion(question, currentAnswer) {
        return `
          <div class="bg-white p-6 rounded-lg shadow-sm border border-outline-variant/20">
            <p class="font-semibold text-on-surface mb-4">${question.text}</p>
            <div class="mb-4 p-4 bg-surface-container-low rounded">
              <p class="text-on-surface-variant italic">"${question.passage}"</p>
            </div>
            <select onchange="app.recordAnswer('${question.id}', this.value)"
                    class="w-full px-4 py-2 bg-surface-container-low border border-outline-variant rounded-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20">
              <option value="">Choose option...</option>
              ${question.options.map(opt => `
                <option value="${opt}" ${currentAnswer === opt ? 'selected' : ''}>${opt}</option>
              `).join('')}
            </select>
            <p class="text-xs text-on-surface-variant mt-3">✓ ${question.points} points</p>
          </div>
        `;
      }

      renderMultipleChoice(question, currentAnswer) {
        return `
          <div class="bg-white p-6 rounded-lg shadow-sm border border-outline-variant/20">
            <p class="font-semibold text-on-surface mb-4">${question.text}</p>
            <div class="space-y-3">
              ${question.options.map((opt, idx) => `
                <label class="flex items-center gap-3 p-3 rounded-lg cursor-pointer hover:bg-surface-container-low transition">
                  <input type="radio" name="q_${question.id}" value="${idx}"
                         onchange="app.recordAnswer('${question.id}', '${idx}')"
                         ${currentAnswer === String(idx) ? 'checked' : ''}
                         class="w-4 h-4">
                  <span class="text-on-surface">${opt}</span>
                </label>
              `).join('')}
            </div>
            <p class="text-xs text-on-surface-variant mt-3">✓ ${question.points} points</p>
          </div>
        `;
      }

      renderFillInBlank(question, currentAnswer) {
        return `
          <div class="bg-white p-6 rounded-lg shadow-sm border border-outline-variant/20">
            <p class="font-semibold text-on-surface mb-4">${question.text}</p>
            <input type="text" placeholder="Type your answer..."
                   value="${currentAnswer || ''}"
                   onchange="app.recordAnswer('${question.id}', this.value)"
                   class="w-full px-4 py-2 bg-surface-container-low border border-outline-variant rounded-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20">
            <p class="text-xs text-on-surface-variant mt-3">✓ ${question.points} points</p>
          </div>
        `;
      }

      renderWritingQuestion(question, currentAnswer) {
        return `
          <div class="bg-white p-6 rounded-lg shadow-sm border border-outline-variant/20">
            <p class="font-semibold text-on-surface mb-4">${question.prompt}</p>
            <textarea onchange="app.recordAnswer('${question.id}', this.value)"
                      placeholder="Write your response here... (150-200 words)"
                      class="w-full px-4 py-2 bg-surface-container-low border border-outline-variant rounded-lg text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 min-h-48">${currentAnswer || ''}</textarea>
            <div class="flex justify-between items-center mt-3">
              <p class="text-xs text-on-surface-variant">✓ ${question.points} points</p>
              <p id="word-count" class="text-xs text-on-surface-variant">0 words</p>
            </div>
          </div>
        `;
      }
    }

    // ============================================
    // TIMER LOGIC
    // ============================================
    class ExamTimer {
      constructor(examManager, renderer) {
        this.exam = examManager;
        this.renderer = renderer;
        this.intervalId = null;
      }

      start() {
        this.update();
        this.intervalId = setInterval(() => this.update(), 1000);
      }

      update() {
        const remaining = this.exam.getTimeRemaining();
        const timerDisplay = document.getElementById('timer-text');
        const timerContainer = document.getElementById('timer-display');

        if (timerDisplay) {
          timerDisplay.textContent = this.renderer.formatTime(remaining);

          // Critical state: last 5 minutes
          if (remaining <= 300) {
            timerDisplay.classList.add('timer-critical');
            timerContainer.classList.add('bg-error-container', 'border-error');
          }

          // Time expired
          if (remaining === 0) {
            this.handleExpired();
          }
        }
      }

      handleExpired() {
        clearInterval(this.intervalId);
        this.exam.currentSession.status = 'expired';
        this.exam.saveSession();

        // Lock exam
        const examPage = document.getElementById('exam-page');
        examPage.classList.add('exam-locked');

        // Show result
        setTimeout(() => {
          app.showResults();
        }, 1000);
      }

      stop() {
        clearInterval(this.intervalId);
      }
    }

    // ============================================
    // AUTOMATIC SCORING SYSTEM
    // ============================================
    class ScoringEngine {
      constructor(exam) {
        this.exam = exam;
      }

      scoreExam() {
        let results = {
          sessionId: this.exam.currentSession.id,
          startedAt: this.exam.currentSession.startedAt,
          completedAt: new Date().toISOString(),
          sections: {},
          totalScore: 0,
          totalMaxPoints: 0
        };

        this.exam.currentExam.sections.forEach(section => {
          let sectionScore = 0;
          let sectionMaxPoints = section.maxPoints;
          let sectionDetails = [];

          if (section.parts) {
            section.parts.forEach(part => {
              part.questions.forEach(question => {
                const answer = this.exam.getAnswer(question.id);
                const score = this.scoreQuestion(question, answer);

                sectionDetails.push({
                  questionId: question.id,
                  question: question.text,
                  userAnswer: answer,
                  correctAnswer: question.correctAnswer,
                  score: score,
                  maxPoints: question.points,
                  isCorrect: score === question.points
                });

                sectionScore += score;
              });
            });
          }

          results.sections[section.id] = {
            name: section.name,
            score: sectionScore,
            maxPoints: sectionMaxPoints,
            percentage: Math.round((sectionScore / sectionMaxPoints) * 100),
            details: sectionDetails
          };

          results.totalScore += sectionScore;
          results.totalMaxPoints += sectionMaxPoints;
        });

        results.totalPercentage = Math.round((results.totalScore / results.totalMaxPoints) * 100);
        return results;
      }

      scoreQuestion(question, answer) {
        if (!answer) return 0;

        // Auto-scoring for objective questions
        if (question.type === 'writing') {
          return this.scoreWriting(question, answer);
        }

        return answer === String(question.correctAnswer) ? question.points : 0;
      }

      scoreWriting(question, text) {
        // Simplified AI-based writing evaluation
        if (!text || text.length < 50) return 0;

        let score = 0;

        // Length score (max 5 points)
        const wordCount = text.split(/\s+/).length;
        if (wordCount >= 150) score += 5;
        else if (wordCount >= 100) score += 3;
        else if (wordCount >= 50) score += 1;

        // Grammar score (max 10 points)
        score += this.evaluateGrammar(text);

        // Vocabulary score (max 10 points)
        score += this.evaluateVocabulary(text);

        // Coherence score (max 10 points)
        score += this.evaluateCoherence(text);

        // Task completion (max 15 points)
        score += this.evaluateTaskCompletion(text, question.prompt);

        return Math.min(45, score);
      }

      evaluateGrammar(text) {
        // Simplified grammar checks
        let score = 8;
        const errors = this.findGrammarErrors(text);
        score -= errors.length * 2;
        return Math.max(0, score);
      }

      evaluateVocabulary(text) {
        // Basic vocabulary complexity score
        const words = text.split(/\s+/);
        const uniqueWords = new Set(words).size;
        const diversityRatio = uniqueWords / words.length;
        return Math.round(diversityRatio * 10);
      }

      evaluateCoherence(text) {
        // Check for connecting words
        const connectors = ['daher', 'darum', 'deshalb', 'ebenso', 'ebenfalls', 'allerdings', 'zwar'];
        let score = 6;
        connectors.forEach(connector => {
          if (text.toLowerCase().includes(connector)) score += 0.5;
        });
        return Math.min(10, score);
      }

      evaluateTaskCompletion(text, prompt) {
        // Check if response addresses key elements
        let score = 10;
        const hasGreeting = /sehr/i.test(text);
        const hasClosing = /mit|freund/i.test(text);
        const hasContent = text.length > 100;

        if (!hasGreeting) score -= 3;
        if (!hasClosing) score -= 2;
        if (!hasContent) score -= 5;

        return Math.max(0, score);
      }

      findGrammarErrors(text) {
        // Simplified grammar error detection
        const errors = [];
        // This would be more sophisticated in production
        return errors;
      }
    }

    // ============================================
    // MAIN APP CONTROLLER
    // ============================================
    class App {
      constructor() {
        this.exam = new ExamManager();
        this.renderer = new UIRenderer(this.exam);
        this.timer = new ExamTimer(this.exam, this.renderer);
        this.scoring = new ScoringEngine(this.exam);
      }

      async init() {
        await this.exam.loadExams();
        this.renderer.renderLandingPage();
      }

      startExam(examId) {
        this.exam.startExam(examId);

        // Hide landing, show exam
        document.getElementById('landing-page').classList.add('hidden');
        document.getElementById('exam-page').classList.remove('hidden');

        // Render interface
        this.renderer.renderExamInterface();

        // Start timer
        this.timer.start();

        // Setup event listeners
        document.getElementById('finish-exam-btn').addEventListener('click', () => this.finishExam());
      }

      selectSection(sectionId) {
        this.renderer.selectSection(sectionId);
      }

      recordAnswer(questionId, answer) {
        this.exam.recordAnswer(questionId, answer);
      }

      finishExam() {
        if (confirm('Are you sure you want to finish the exam? You cannot continue after this.')) {
          this.timer.stop();
          this.showResults();
        }
      }

      showResults() {
        this.timer.stop();

        // Calculate scores
        const results = this.scoring.scoreExam();

        // Hide exam, show results
        document.getElementById('exam-page').classList.add('hidden');
        document.getElementById('results-page').classList.remove('hidden');

        // Render results
        this.renderResults(results);
      }

      renderResults(results) {
        const resultsPage = document.getElementById('results-page');

        let html = `
          <div class="px-6">
            <div class="text-center mb-12">
              <h1 class="text-4xl font-bold text-on-surface mb-2">Prüfung abgeschlossen</h1>
              <p class="text-on-surface-variant">Ihre Ergebnisse werden verarbeitet...</p>
            </div>

            <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-sm border border-outline-variant/20 p-8 mb-8">
              <div class="text-center mb-8">
                <p class="text-on-surface-variant mb-2">Gesamtscore</p>
                <h2 class="text-5xl font-bold text-primary mb-2">${results.totalScore} / ${results.totalMaxPoints}</h2>
                <p class="text-xl text-on-surface-variant">${results.totalPercentage}%</p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${Object.entries(results.sections).map(([key, section]) => `
                  <div class="p-6 bg-surface-container-low rounded-lg">
                    <h3 class="font-semibold text-on-surface mb-3">${section.name}</h3>
                    <p class="text-2xl font-bold text-primary mb-2">${section.score} / ${section.maxPoints}</p>
                    <div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
                      <div class="h-full bg-primary" style="width: ${section.percentage}%"></div>
                    </div>
                    <p class="text-xs text-on-surface-variant mt-2">${section.percentage}%</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="text-center">
              <button onclick="location.reload()" class="px-8 py-3 bg-primary text-on-primary rounded-lg font-semibold hover:bg-primary-container transition">
                Start New Exam
              </button>
            </div>
          </div>
        `;

        resultsPage.innerHTML = html;
      }
    }

    // Initialize app
    const app = new App();
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
